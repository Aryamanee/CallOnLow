[tool.briefcase]
project_name = "Call On Low"
bundle = "com.aryamanee"
version = "0.0.1"
url = "https://aryamanee.github.io/callonlow"
license = "BSD license"
author = 'Aryamanee'
author_email = "aryamansawhney@hotmail.com"

[tool.briefcase.app.callonlow]
formal_name = "Call On Low"
description = "An app that constantly polls dexcom's share servers and makes a call using ifttt if a certain threshold is met"
icon = "src/callonlow/resources/callonlow"
sources = ['src/callonlow']
requires = [
]


[tool.briefcase.app.callonlow.macOS]
requires = [
    'toga-cocoa>=0.3.0.dev38',
    'std-nslog~=1.0.0'
]

[tool.briefcase.app.callonlow.linux]
requires = [
    'toga-gtk>=0.3.0.dev38',
]

[tool.briefcase.app.callonlow.linux.appimage]
system_requires = [
    'gir1.2-webkit-3.0',
    'libcairo2-dev',
    'libgirepository1.0-dev',
    'libgtk-3-dev',
    'libpango1.0-dev',
    'librsvg2-dev',
    'libwebkitgtk-3.0-0',
]
linuxdeploy_plugins = [
    'DEPLOY_GTK_VERSION=3 gtk',
]

[tool.briefcase.app.callonlow.linux.flatpak]
flatpak_runtime = 'org.gnome.Platform'
flatpak_runtime_version = '42'
flatpak_sdk = 'org.gnome.Sdk'

[tool.briefcase.app.callonlow.windows]
requires = [
    'toga-winforms>=0.3.0.dev38',
]

# Mobile deployments
[tool.briefcase.app.callonlow.iOS]
requires = [
    'toga-iOS>=0.3.0.dev38',
    'std-nslog~=1.0.0'
]

[tool.briefcase.app.callonlow.android]
requires = [
    'toga-android>=0.3.0.dev38'
]

[tool.briefcase.app.callonlow.web]
requires = [
    # Workaround; toga-web 0.3.0.dev38 doesn't include toga-core as a dependency.
    "toga-core>=0.3.0.dev38",
    "toga-web>=0.3.0.dev38",
]
style_framework = "Bootstrap v4.6"
